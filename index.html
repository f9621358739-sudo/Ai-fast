<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image & Thumbnail Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header-box {
            text-align: center;
            margin-bottom: 15px;
        }
        .header-box img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 8px;
        }
        .welcome-text {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .time-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 15px;
            color: #38bdf8;
            font-size: 22px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        label {
            font-size: 14px;
            color: #cbd5e1;
        }
        select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }
        textarea {
            height: 90px;
            resize: none;
        }
        select:focus, textarea:focus {
            border-color: #38bdf8;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn:hover {
            background: #0ea5e9;
        }
        .btn-download {
            background: #22c55e;
            color: white;
            margin-top: 15px;
            display: none;
        }
        .btn-download:hover {
            background: #16a34a;
        }
        .result-container {
            text-align: center;
            margin-top: 20px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed #475569;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            padding: 10px;
        }
        .result-container img {
            max-width: 100%;
            border-radius: 8px;
            display: none;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body onload="speakWelcome()">

    <div class="container">
        <!-- Logo and Welcome -->
        <div class="header-box">
            <img src="https://photos.app.goo.gl/SpEbT8Ph8sd235xb6" alt="Logo">
            <div class="welcome-text">Hello Ashish Chaudhry Sir</div>
            <div class="time-text" id="liveTime">Loading time...</div>
        </div>

        <h2>AI Image & Thumbnail Generator</h2>
        
        <div class="input-group">
            <label>Select Size / Type:</label>
            <select id="imageSize">
                <option value="512x512">Square (512 x 512)</option>
                <option value="1280x720">YouTube Thumbnail (1280 x 720)</option>
                <option value="1024x1024">HD Square (1024 x 1024)</option>
            </select>

            <label>Enter Prompt:</label>
            <textarea id="prompt" placeholder="Jaise: A gaming thumbnail background..."></textarea>
            
            <button class="btn" onclick="generateImage()">Generate Image</button>
        </div>
        
        <div class="result-container" id="resultBox">
            <div class="loader" id="loader"></div>
            <img id="generatedImage" alt="AI Generated Image" crossorigin="anonymous" onload="imageLoaded()">
            <p id="placeholderText" style="color: #94a3b8;">Aapki image yahan dikhegi...</p>
        </div>

        <a id="downloadBtn" class="btn btn-download" download="ai-image.jpg">Download Image</a>
    </div>

    <script>
        // Live Time Show Karne ke liye
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('liveTime').innerText = "Current Time: " + hours + ":" + minutes + ":" + seconds + " " + ampm;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // App khulte hi bolne ke liye (Voice Greeting)
        function speakWelcome() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("Hello Ashish Chaudhry Sir");
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        let currentImageUrl = "";

        function generateImage() {
            const promptText = document.getElementById('prompt').value.trim();
            const sizeValue = document.getElementById('imageSize').value;
            const loader = document.getElementById('loader');
            const imgElement = document.getElementById('generatedImage');
            const placeholder = document.getElementById('placeholderText');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!promptText) {
                alert('Pehle kuch prompt toh likhiye!');
                return;
            }

            placeholder.style.display = 'none';
            imgElement.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'block';

            let width = 512;
            let height = 512;
            if (sizeValue === "1280x720") {
                width = 1280;
                height = 720;
            } else if (sizeValue === "1024x1024") {
                width = 1024;
                height = 1024;
            }

            const encodedPrompt = encodeURIComponent(promptText);
            currentImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&nologo=true`;
            
            imgElement.src = currentImageUrl;
        }

        function imageLoaded() {
            const loader = document.getElementById('loader');
            const imgElement = document.getElementById('generatedImage');
            const downloadBtn = document.getElementById('downloadBtn');
            
            loader.style.display = 'none';
            imgElement.style.display = 'block';
            downloadBtn.style.display = 'block';
            downloadBtn.href = currentImageUrl;
        }
    </script>

</body>
</html>
